[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "churn-retention-decision-system"
version = "0.1.0"
description = "Explainable churn prediction + retention ROI decision system for Customer Success teams"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.6",   # sklearn.frozen.FrozenEstimator
    "xgboost-cpu>=2.1; sys_platform == 'linux'",   # avoids pulling CUDA NCCL on Linux
    "xgboost>=2.1; sys_platform != 'linux'",
    "optuna>=4.0",
    "shap>=0.46",
    "pyarrow>=15",
    "matplotlib>=3.8",
    "plotly>=5.20",
    "streamlit>=1.38",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "joblib>=1.3",
    "rich>=13.7",
]

[project.optional-dependencies]
llm = [
    "google-genai>=1.0",
    "openai>=1.40",
    "anthropic>=0.40",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.setuptools]
packages = ["src", "src.app_views"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
